# Render Blueprint: платформа + база Postgres в один клик (Dashboard → New → Blueprint).
# Бесплатные тарифы подходят для проверки: сервис засыпает через 15 минут без посещений,
# бесплатная база удаляется через 30 дней, загруженные файлы пропадают при перезапуске.
services:
  - type: web
    name: asdic
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asdic-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ASDIC_ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false

databases:
  - name: asdic-db
    plan: free
    region: frankfurt
    databaseName: asdic
    user: asdic
